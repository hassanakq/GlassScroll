name: Release

# Push a tag such as v1.0.1 (git tag v1.0.1 && git push origin v1.0.1)
# or run this workflow manually from the Actions tab and enter a version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve version
        id: v
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT -eq "workflow_dispatch") { $ver = $env:INPUT_VERSION } else { $ver = $env:REF_NAME }
          $ver = $ver.Trim().TrimStart("v")
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Build executable
        shell: pwsh
        run: ./scripts/build.ps1 -Version "${{ steps.v.outputs.version }}"

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/GlassScroll.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  GlassScroll.exe" | Out-File dist/GlassScroll.exe.sha256 -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: GlassScroll ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/GlassScroll.exe
            dist/GlassScroll.exe.sha256
